/pure_pursuit_multi_node:
  ros__parameters:
    use_sim: false

    lookahead_min: 0.8
    lookahead_max: 3.0
    lookahead_window: 5
    lookahead_idx_fwd: 6 # 0 = distance-based; >0 = fixed index offset (try 5-8 with dense turn-biased waypoints)

    max_curvature: 0.4
    fast_speed: 8.5
    slow_speed: 2.5
    use_waypoint_speed: true
    # brake_lookahead: 0 # not good anymore - overengineering since wayppoint speed takes care of this
    max_accel: 2.5
    publish_drive: true

    use_steer_filter: false
    steer_deadband: 0.01
    steer_alpha: 0.4

    # Multi-lane / opponent-reactive switching for real-car deployment
    # opp_predictor publishes PoseStamped on /opp_predict/state.
    # Set opponent_topic to "" to disable switching and behave as the original single-lane node.
    opponent_topic: "/opp_predict/state"
    opponent_msg_type: "PoseStamped"
    # If any waypoint within `lane_lookahead_idx` ahead of ego on a lane lies within
    # this distance of the opponent, that lane is considered blocked.
    # Real LiDAR is noisier than sim, so this is slightly more permissive than sim's 0.4.
    lane_occupied_dist: 0.5
    # Cooldown between consecutive lane switches (seconds), prevents flapping.
    min_switch_interval_sec: 0.5
    # Number of forward waypoints scanned per lane when checking occupancy.
    lane_lookahead_idx: 8

    # Adaptive cruise / follow-mode (see sim_params.yaml for explanation).
    # Real-car defaults are slightly more conservative than sim.
    follow_min_speed: 0.0
    follow_max_speed: 3.0
    follow_brake_dist: 0.7
    follow_release_dist: 3.0
