/pure_pursuit_boost_node:
  ros__parameters:
    use_sim: false
    csv_path: "[file].csv"
    lookahead_dist: 1.25 # ignored
    lookahead_min: 1.5
    lookahead_max: 4.0
    lookahead_window: 5
    max_curvature: 0.4
    fast_speed: 8.5
    slow_speed: 2.5
    steering_limit: 0.4189
    use_waypoint_speed: true

    # Per-waypoint brake mode (CSV col5: 0=min, 1=avg)
    min_brake_lookahead: 5    # used where col5 = 0
    avg_brake_lookahead: 3    # used where col5 = 1
    brake_lookahead: -5       # legacy fallback (ignored when col5 exists)

    max_accel: 2.5
    steer_alpha: 0.4

    use_steer_filter: false
    steer_deadband: 0.025

    lookahead_ratio: 8.0
    use_velocity_lookahead: false